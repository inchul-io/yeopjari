<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws: wss:; img-src 'self' data:">
<title>옆자리</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif; }
  #stage { position: absolute; inset: 0; }
  .char { position: absolute; bottom: 4px; width: 140px; margin-left: -70px; display: flex; flex-direction: column;
    align-items: center; pointer-events: none; will-change: transform, left; }
  .char canvas { image-rendering: pixelated; width: 64px; height: 68px; pointer-events: auto; cursor: pointer;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.18)); transition: filter .15s; }
  .char canvas:hover { filter: drop-shadow(0 0 4px rgba(255,255,255,.9)) drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
  .char.offline canvas { opacity: .45; }
  .tag { font-size: 11px; font-weight: 700; color: #2b2233; background: rgba(255,255,255,.88); padding: 1px 7px 1px 6px;
    border-radius: 8px; margin-bottom: 2px; white-space: nowrap; box-shadow: 0 1px 0 rgba(0,0,0,.15); display: flex; align-items: center; gap: 4px; }
  .tag i { width: 6px; height: 6px; border-radius: 50%; background: #9aa0a6; display: inline-block; }
  .online .tag i { background: #2ecc71; }
  .away .tag i { background: #f5b301; }
  .char.me .tag { background: #2b2233; color: #fff; }
  .bubble { max-width: 200px; font-size: 12.5px; line-height: 1.35; color: #2b2233; background: #fff; border: 2px solid #2b2233;
    border-radius: 10px; padding: 5px 9px; margin-bottom: 6px; position: relative; word-break: break-all; white-space: pre-wrap;
    opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .18s, transform .18s; pointer-events: none; }
  .bubble.show { opacity: 1; transform: none; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -5px; width: 8px; height: 8px;
    background: #fff; border-right: 2px solid #2b2233; border-bottom: 2px solid #2b2233; transform: rotate(45deg); }
  .bubble.typing { letter-spacing: 2px; font-weight: 700; }
  .fx { position: absolute; bottom: 50px; left: 50%; font-size: 12px; font-weight: 700; color: #6b5b95; pointer-events: none; white-space: nowrap; }
  .zz { animation: zz 2.4s infinite ease-in-out; margin-left: 18px; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -14px); } }
  .stars { margin-left: -16px; color: #f5b301; font-size: 14px; animation: spin .6s linear infinite; display: inline-block; }
  .poop { position: absolute; left: -11px; bottom: 6px; font-size: 20px; animation: wob 1s ease-in-out infinite; }
  .poop b { position: absolute; left: 4px; top: -14px; font-size: 11px; color: #7a8b3a; animation: zz 1.2s infinite; }
  @keyframes wob { 50% { transform: rotate(-8deg) translateY(-1px); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  #composer { position: absolute; bottom: 118px; width: 260px; margin-left: -130px; display: none; background: #fff;
    border: 2px solid #2b2233; border-radius: 12px; padding: 6px; box-shadow: 0 4px 0 rgba(43,34,51,.25); }
  #composer.show { display: flex; gap: 6px; }
  #composer input { flex: 1; border: none; outline: none; font: inherit; font-size: 13px; padding: 4px 6px; background: #fff8ef; border-radius: 6px; }
  #composer button { border: none; background: #2b2233; color: #fff; font: inherit; font-size: 12px; font-weight: 700; padding: 0 10px; border-radius: 6px; cursor: pointer; }
  #composer .count { position: absolute; right: 8px; top: -18px; font-size: 10px; color: #fff; background: #2b2233; padding: 0 5px; border-radius: 6px; }

  #menu { position: absolute; display: none; background: #fff; border: 2px solid #2b2233; border-radius: 10px; padding: 4px;
    box-shadow: 0 4px 0 rgba(43,34,51,.25); font-size: 12px; z-index: 10; }
  #menu.show { display: block; }
  #menu .title { font-weight: 700; padding: 3px 8px 5px; color: #6b5b95; border-bottom: 1px dashed #ddd; margin-bottom: 3px; }
  #menu .grid { display: grid; grid-template-columns: repeat(4, 34px); gap: 2px; }
  #menu button { border: none; background: none; font-size: 19px; height: 32px; border-radius: 6px; cursor: pointer; }
  #menu button:hover { background: #fff1d6; }
  #menu .wide { grid-column: span 4; font-size: 12px; font-family: inherit; font-weight: 700; color: #2b2233; }

  .proj { position: absolute; font-size: 22px; pointer-events: none; z-index: 5; }
  #status { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: #fff; background: rgba(43,34,51,.7);
    padding: 2px 7px; border-radius: 8px; display: none; }
  #status.show { display: block; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="composer" class="hit">
    <span class="count">0/80</span>
    <input id="msg" maxlength="80" placeholder="동료들에게 한마디 (Enter 전송 · Esc 닫기)" autocomplete="off">
    <button id="send">보내기</button>
  </div>
  <div id="menu" class="hit"></div>
  <div id="status"></div>
  <script src="sprites.js"></script>
  <script src="mqtt-lite.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
