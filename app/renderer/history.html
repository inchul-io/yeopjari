<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>옆자리 최근 대화</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff8ef; color: #2b2233; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; font-size: 13px;
    display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 16px; font-weight: 700; font-size: 15px; border-bottom: 2px solid #2b2233; }
  header span { font-weight: 400; color: #7a6f80; font-size: 12px; margin-left: 6px; }
  #list { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .day { text-align: center; color: #7a6f80; font-size: 11px; margin: 10px 0 6px; }
  .m { margin: 5px 0; display: flex; flex-direction: column; align-items: flex-start; }
  .m.mine { align-items: flex-end; }
  .who { font-size: 11px; color: #6b5b95; font-weight: 700; margin: 0 4px 2px; }
  .txt { background: #fff; border: 2px solid #2b2233; border-radius: 10px; padding: 5px 9px; max-width: 80%; white-space: pre-wrap; word-break: break-all; }
  .mine .txt { background: #2b2233; color: #fff; }
  .time { font-size: 10px; color: #a39aa8; margin: 1px 4px 0; }
  .empty { text-align: center; color: #a39aa8; margin-top: 40px; }
  form { display: flex; gap: 6px; padding: 10px; border-top: 2px solid #2b2233; }
  input { flex: 1; padding: 8px 10px; border: 2px solid #2b2233; border-radius: 8px; font: inherit; }
  button { border: none; background: #2b2233; color: #fff; border-radius: 8px; padding: 0 14px; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>최근 대화<span>최근 7일 · 이 PC에만 저장</span></header>
<div id="list"></div>
<form id="f"><input id="t" maxlength="80" placeholder="메시지 보내기" autocomplete="off"><button>보내기</button></form>
<script src="history.js"></script>
</body>
</html>
